<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0F1117;--surface:#1A1D27;--surface2:#22263A;--border:#2E3350;
    --accent:#F97316;--accent-light:rgba(249,115,22,0.12);

    --red:#EF4444;--red-bg:rgba(239,68,68,0.12);
    --blue:#3B82F6;--blue-bg:rgba(59,130,246,0.12);

  *{font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:var(--bg);color:var(--text);min-height:100vh;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--surface);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--border);}
  .logo-area{padding:24px 20px 20px;border-bottom:1px solid var(--border);}
  .logo-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
  .logo-evo{color:var(--accent);}
  .logo-sub{font-size:11px;color:var(--text3);margin-top:3px;}
  .nav-section{padding:16px 0;}
  .nav-label{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--text3);padding:0 20px;margin-bottom:8px;text-transform:uppercase;}

  .nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04);}
  .nav-item.active{color:var(--accent);background:var(--accent-light);border-left-color:var(--accent);}
  .nav-item i{font-size:16px;}
  .badge-pill{background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px;margin-left:auto;}
  .sidebar-footer{margin-top:auto;padding:16px 0;border-top:1px solid var(--border);}
  .main{flex:1;overflow:auto;display:flex;flex-direction:column;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
  .page-title{font-size:16px;font-weight:700;color:var(--text);}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .notif-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--text3);font-size:15px;transition:all 0.15s;display:flex;align-items:center;}
  .notif-btn:hover{color:var(--accent);border-color:var(--accent);}
  .notif-btn.active{color:var(--green);border-color:rgba(34,197,94,0.4);}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 14px 5px 6px;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
  .user-name{font-size:12px;color:var(--text2);}
  .content{padding:24px 28px;flex:1;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 16px;}
  .stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
  .stat-num{font-size:28px;font-weight:800;color:var(--text);}
  .stat-num.orange{color:var(--accent);}
  .stat-num.green{color:var(--green);}
  .stat-num.red{color:var(--red);}
  .stat-trend{font-size:11px;color:var(--text3);margin-top:4px;}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .section-title{font-size:15px;font-weight:700;color:var(--text);}
  .pub-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;transition:box-shadow 0.15s;}
  .pub-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.4);}
  .pub-thumb{width:100%;height:320px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .pub-thumb img,.pub-thumb video{width:100%;height:100%;object-fit:cover;}
  .pub-thumb i{font-size:52px;color:var(--text3);}
  .pub-thumb-overlay{position:absolute;top:10px;left:10px;display:flex;gap:6px;}
  .pub-thumb-actions{position:absolute;top:10px;right:10px;}
  .thumb-btn{background:rgba(0,0,0,0.6);border:none;border-radius:7px;padding:7px 9px;cursor:pointer;color:#fff;font-size:15px;backdrop-filter:blur(4px);transition:background 0.15s;}
  .thumb-btn:hover{background:rgba(249,115,22,0.85);}
  .pub-body{padding:14px 16px 6px;}
  .pub-footer{padding:10px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--border);}
  .pub-type-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .type-tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;padding:3px 8px;border-radius:5px;}
  .type-tag.imagen{background:var(--blue-bg);color:var(--blue);}
  .type-tag.video{background:var(--green-bg);color:var(--green);}
  .pub-date{font-size:11px;color:var(--text3);}
  .pub-caption-wrap{position:relative;margin-bottom:8px;}
  .pub-caption{font-size:13px;color:var(--text2);line-height:1.6;padding-right:32px;}
  .caption-edit-btn{position:absolute;top:0;right:0;background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--text3);font-size:12px;transition:all 0.15s;}
  .caption-edit-btn:hover{color:var(--accent);border-color:var(--accent);}
  .caption-textarea{width:100%;background:var(--surface2);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);line-height:1.6;resize:vertical;min-height:80px;margin-bottom:8px;}
  .caption-textarea:focus{outline:none;}
  .caption-btns{display:flex;gap:6px;}
  .caption-save{font-size:11px;padding:5px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
  .caption-cancel{font-size:11px;padding:5px 12px;background:transparent;color:var(--text3);border:1px solid var(--border);border-radius:6px;cursor:pointer;}
  .pub-platforms{display:flex;gap:6px;margin-top:4px;}
  .platform-tag{font-size:10px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;}
  .pub-actions{display:flex;gap:7px;align-items:center;}

  .status-pill.pending{background:var(--accent-light);color:var(--accent);}
  .status-pill.approved{background:var(--green-bg);color:var(--green);}
  .status-pill.rejected{background:var(--red-bg);color:var(--red);}
  .status-pill.published{background:rgba(99,102,241,0.15);color:#818CF8;}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all 0.15s;color:var(--text2);}
  .btn:hover{background:var(--surface);color:var(--text);}
  .btn.approve{border-color:rgba(34,197,94,0.4);color:var(--green);background:var(--green-bg);}
  .btn.approve:hover{background:rgba(34,197,94,0.2);}
  .btn.reject{border-color:rgba(239,68,68,0.4);color:var(--red);background:var(--red-bg);}
  .btn.reject:hover{background:rgba(239,68,68,0.2);}
  .btn-primary{padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.15s;}
  .btn-primary:hover{background:#EA6C0A;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
  .empty-state i{font-size:42px;margin-bottom:12px;display:block;}
  .empty-state p{font-size:13px;}
  .loading{text-align:center;padding:40px;color:var(--text3);font-size:13px;}
  .error-msg{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--red);margin-bottom:16px;}
  .success-msg{background:var(--green-bg);border:1px solid rgba(34,197,94,0.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--green);margin-bottom:16px;}
  .info-msg{background:var(--blue-bg);border:1px solid rgba(59,130,246,0.3);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--blue);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .card-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px;}
  .panel-label{font-size:11px;font-weight:600;letter-spacing:0.7px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:18px;}
  .day-btn{padding:9px 4px;border:1px solid var(--border);border-radius:7px;text-align:center;cursor:pointer;font-size:12px;background:var(--surface2);transition:all 0.15s;color:var(--text2);}
  .day-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-btn:hover:not(.sel){background:var(--surface);color:var(--text);}
  .field-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .field-label{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;}
  .form-select{padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);font-size:13px;color:var(--text);}
  .schedule-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
  .schedule-main{font-size:13px;font-weight:500;color:var(--text);}
  .schedule-days{font-size:11px;color:var(--text3);margin-top:2px;}
  .btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--text3);font-size:13px;transition:all 0.15s;}
  .btn-icon:hover{background:var(--red-bg);color:var(--red);border-color:rgba(239,68,68,0.4);}
  .history-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .history-icon{width:40px;height:40px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;}
  .login-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 65% 15%,rgba(249,115,22,0.1) 0%,transparent 55%),radial-gradient(ellipse at 15% 85%,rgba(59,130,246,0.07) 0%,transparent 50%);pointer-events:none;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:380px;box-shadow:0 8px 40px rgba(0,0,0,0.5);position:relative;z-index:1;}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .login-icon{width:38px;height:38px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#fff;}
  .login-title{font-size:22px;font-weight:800;color:var(--text);}
  .login-sub{font-size:13px;color:var(--text3);margin-bottom:28px;line-height:1.5;}
  .form-group{margin-bottom:16px;}
  .form-label{font-size:12px;font-weight:500;margin-bottom:6px;display:block;color:var(--text2);}
  .form-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13px;color:var(--text);}
  .form-input:focus{outline:none;border-color:var(--accent);}
  .btn-login{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background 0.15s;}
  .btn-login:hover{background:#EA6C0A;}
  .err-msg{font-size:12px;color:var(--red);margin-bottom:10px;}
  .refresh-btn{font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:4px;}
  .refresh-btn:hover{background:var(--surface2);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-inner{max-width:92vw;max-height:90vh;position:relative;}
  .modal-inner img{max-width:90vw;max-height:86vh;object-fit:contain;border-radius:10px;}
  .modal-inner video{max-width:90vw;max-height:86vh;border-radius:10px;}
  .modal-close{position:fixed;top:18px;right:22px;background:rgba(255,255,255,0.1);border:none;border-radius:8px;padding:8px 12px;cursor:pointer;color:#fff;font-size:18px;backdrop-filter:blur(6px);}
  .modal-close:hover{background:rgba(239,68,68,0.6);}
  .prompt-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);font-size:13px;color:var(--text);resize:vertical;min-height:70px;}
  .prompt-input:focus{outline:none;border-color:var(--accent);}
  .tiktok-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .tiktok-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;padding:24px;}
  .tiktok-modal-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .tiktok-icon{width:36px;height:36px;background:#010101;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;}
  .tiktok-title{font-size:15px;font-weight:700;color:var(--text);}
  .tiktok-sub{font-size:11px;color:var(--text3);margin-top:1px;}
  .tiktok-section{margin-bottom:16px;}
  .tiktok-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text3);margin-bottom:8px;}
  .tiktok-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13px;color:var(--text);cursor:pointer;}
  .tiktok-select:focus{outline:none;border-color:var(--accent);}
  .tiktok-check-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;}
  .tiktok-check-info{font-size:13px;color:var(--text);}
  .tiktok-check-sub{font-size:11px;color:var(--text3);margin-top:1px;}
  .tiktok-toggle{position:relative;width:36px;height:20px;flex-shrink:0;}
  .tiktok-toggle input{opacity:0;width:0;height:0;}
  .tiktok-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:background 0.2s;}
  .tiktok-toggle input:checked+.tiktok-slider{background:var(--accent);}
  .tiktok-slider:before{content:'';position:absolute;height:14px;width:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform 0.2s;}
  .tiktok-toggle input:checked+.tiktok-slider:before{transform:translateX(16px);}
  .tiktok-disclaimer{font-size:11px;color:var(--text3);line-height:1.5;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:16px;}
  .tiktok-footer{display:flex;gap:8px;justify-content:flex-end;}
  .tiktok-cancel{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:13px;color:var(--text2);}
  .tiktok-confirm{padding:9px 18px;border-radius:8px;border:none;background:var(--green);cursor:pointer;font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:6px;}
  .tiktok-confirm:disabled{opacity:0.5;cursor:not-allowed;}
</style>
</head>

const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxemttdGxjd21xd3dwcHlzb3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDA3MjYsImV4cCI6MjA5MzY3NjcyNn0.guBRwkf0V_gWVM2ogqk70mYUMWjKKhwFiifndWBlwT8';
const H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

async function fetchPubs(){const r=await fetch(SUPA_URL+'/rest/v1/publicaciones?order=created_at.desc',{headers:H});if(!r.ok)throw new Error();return r.json();}
async function updateStatus(id,status){await fetch(SUPA_URL+'/rest/v1/publicaciones?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({status})});}
async function updateCaption(id,caption){await fetch(SUPA_URL+'/rest/v1/publicaciones?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({caption})});}
async function fetchCalendario(){const r=await fetch(SUPA_URL+'/rest/v1/calendario?order=id.asc',{headers:H});if(!r.ok)throw new Error();return r.json();}
async function insertCalendario(row){await fetch(SUPA_URL+'/rest/v1/calendario',{method:'POST',headers:H,body:JSON.stringify(row)});}

const USERS={admin:{pass:'admin123',role:'admin',name:'Nicolás'},cliente:{pass:'wp2024',role:'client',name:'Cliente'}};

const DAYS_F=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

// ── Notificaciones ──────────────────────────────────────────
let lastNotifiedIds=new Set();

function registerSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
}

async function requestNotifPermission(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  const result=await Notification.requestPermission();
  return result==='granted';
}

function showNotif(count){
  if(Notification.permission!=='granted')return;
  new Notification('PostIA — EvoGym 🏋️', {
    body: count===1?'Tenés 1 publicación pendiente para revisar.':'Tenés '+count+' publicaciones pendientes para revisar.',
    tag:'postia-pending',
    renotify:true,
    requireInteraction:true
  });
}

function checkAndNotify(pubs){
  const newPending=pubs.filter(function(p){
    return p.status==='pending'&&!lastNotifiedIds.has(p.id);
  });
  if(newPending.length>0){
    showNotif(newPending.length);
    newPending.forEach(function(p){lastNotifiedIds.add(p.id);});
  }
}
// ────────────────────────────────────────────────────────────

function Modal({url,tipo,onClose}){
  return h('div',{className:'modal-overlay',onClick:onClose},
    h('button',{className:'modal-close',onClick:onClose},h('i',{className:'ti ti-x'})),
    h('div',{className:'modal-inner',onClick:function(e){e.stopPropagation();}},
      tipo==='video'?h('video',{src:url,controls:true,autoPlay:true}):h('img',{src:url,alt:'preview'})
    )
  );
}

function TikTokModal({pub,onConfirm,onClose}){
  const isVideo=pub.tipo==='video';
  const [privacy,setPrivacy]=useState('');
  const [allowComment,setAllowComment]=useState(false);
  const [allowDuet,setAllowDuet]=useState(false);
  const [allowStitch,setAllowStitch]=useState(false);
  const canConfirm=privacy!=='';
  return h('div',{className:'tiktok-overlay',onClick:onClose},
    h('div',{className:'tiktok-modal',onClick:function(e){e.stopPropagation();}},
      h('div',{className:'tiktok-modal-header'},
        h('div',{className:'tiktok-icon'},h('i',{className:'ti ti-brand-tiktok'})),
        h('div',null,
          h('div',{className:'tiktok-title'},'Configuración para TikTok'),
          h('div',{className:'tiktok-sub'},'Elegí las opciones antes de publicar')
        )
      ),
      h('div',{className:'tiktok-section'},

function Dashboard({notifEnabled,onEnableNotif}){

    fetch(SUPA_URL+'/rest/v1/publicaciones?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify(body)}).then(function(){setPubs(function(prev){return prev.map(function(p){return p.id===id?Object.assign({},p,{status:'approved'}):p;});});showToast('✅ Publicación aprobada');setAl(false);}).catch(function(){setError('Error');setAl(false);});

      h('div',{className:'stat-card'},h('div',{className:'stat-label'},'Pendientes'),h('div',{className:'stat-num orange'},pending),h('div',{className:'stat-trend'},'requieren revisión')),
      h('div',{className:'stat-card'},h('div',{className:'stat-label'},'Aprobadas'),h('div',{className:'stat-num green'},approved),h('div',{className:'stat-trend'},'publicadas')),
      h('div',{className:'stat-card'},h('div',{className:'stat-label'},'Rechazadas'),h('div',{className:'stat-num red'},rejected),h('div',{className:'stat-trend'},'regeneradas'))

function App(){
  const [user,setUser]=useState(null);

  useEffect(function(){registerSW();},[]);

  useEffect(function(){
    if(!user)return;
    function check(){fetchPubs().then(function(d){setPendingCount(d.filter(function(p){return p.status==='pending';}).length);}).catch(function(){});}
    check();const iv=setInterval(check,15000);return function(){clearInterval(iv);};
