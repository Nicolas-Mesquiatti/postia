<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostIA — EvoGym</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0A0B0F;--sf:#13151C;--sf2:#1A1D26;--sf3:#222632;
  --br:rgba(255,255,255,0.06);--br2:rgba(255,255,255,0.11);
  --tx:#EDEEF3;--tx2:#979DB1;--tx3:#5B6175;
  /* ACENTO — cambialo acá en un solo lugar */
  --ac:#7B5CF0;--ac2:#9277F5;--acd:#6A48E8;--acl:rgba(123,92,240,0.13);--ac-gl:rgba(123,92,240,0.55);
  --gn:#34D399;--gnb:rgba(52,211,153,0.12);
  --rd:#F87171;--rdb:rgba(248,113,113,0.12);
  --bl:#38BDF8;--blb:rgba(56,189,248,0.12);
  --vl:#A78BFA;
  --shadow:0 1px 0 rgba(255,255,255,0.04) inset,0 10px 30px -12px rgba(0,0,0,0.7);
  --shadow-lg:0 1px 0 rgba(255,255,255,0.05) inset,0 24px 60px -20px rgba(0,0,0,0.8);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --fnt:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,system-ui,sans-serif;
}
html,body{font-family:var(--fnt);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body{background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5;
  background-image:radial-gradient(900px 500px at 100% -5%,rgba(123,92,240,0.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(56,189,248,0.05),transparent 55%);
  background-attachment:fixed;}
::selection{background:var(--ac-gl);color:#fff;}
button{font-family:var(--fnt);}
.app{display:flex;min-height:100vh;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);z-index:199;animation:fade .2s var(--ease);}
.overlay.open{display:block;}

/* ===== SIDEBAR ===== */
.sb{width:248px;background:linear-gradient(180deg,#13151C,#101218);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--br);transition:transform .3s var(--ease);position:relative;z-index:200;}
.sb-logo{padding:22px 20px 18px;}
.brand{display:flex;align-items:center;gap:11px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(150deg,var(--ac2),var(--acd));display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;box-shadow:0 6px 18px -4px var(--ac-gl),0 1px 0 rgba(255,255,255,0.25) inset;flex-shrink:0;}
.brand-tx .sb-title{font-size:17px;font-weight:750;letter-spacing:-0.4px;line-height:1.1;}
.brand-tx .sb-sub{font-size:11px;color:var(--tx3);margin-top:2px;letter-spacing:0.2px;}
.sb-evo{color:var(--ac2);}
.sb-nav{padding:8px 12px;flex:1;}
.sb-lbl{font-size:10px;font-weight:650;letter-spacing:1.4px;color:var(--tx3);padding:14px 8px 8px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--tx2);transition:all .18s var(--ease);border-radius:9px;position:relative;margin-bottom:2px;}
.nav-item i{font-size:18px;width:20px;text-align:center;transition:transform .18s var(--ease);}
.nav-item:hover{color:var(--tx);background:rgba(255,255,255,0.04);}
.nav-item:hover i{transform:translateX(1px);}
.nav-item.on{color:#fff;background:linear-gradient(90deg,var(--acl),rgba(123,92,240,0.04));}
.nav-item.on:before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--ac);box-shadow:0 0 12px var(--ac-gl);}
.nav-item.on i{color:var(--ac2);}
.badge{background:var(--ac);color:#fff;font-size:10px;font-weight:700;border-radius:20px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-left:auto;box-shadow:0 2px 8px -1px var(--ac-gl);}
.sb-foot{padding:12px;border-top:1px solid var(--br);}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px;}
.sb-user .av{width:32px;height:32px;font-size:12px;}
.sb-user-tx{min-width:0;flex:1;}
.sb-user-name{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-user-role{font-size:11px;color:var(--tx3);}
.logout-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;font-size:13px;color:var(--tx3);transition:all .18s var(--ease);border-radius:9px;}
.logout-btn:hover{color:var(--rd);background:var(--rdb);}
.logout-btn i{font-size:17px;}

/* ===== MAIN ===== */
.main{flex:1;overflow:auto;display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(13,15,20,0.72);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--br);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0;}
.ham{display:none;background:transparent;border:none;cursor:pointer;color:var(--tx2);font-size:22px;line-height:1;padding:2px;border-radius:8px;transition:.15s;}
.ham:hover{color:var(--tx);}
.pg-title{font-size:16px;font-weight:700;letter-spacing:-0.3px;}
.pg-crumb{font-size:11px;color:var(--tx3);margin-top:1px;}
.tb-right{display:flex;align-items:center;gap:9px;}
.bell-btn{background:var(--sf2);border:1px solid var(--br);border-radius:10px;width:38px;height:38px;cursor:pointer;color:var(--tx3);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .18s var(--ease);}
.bell-btn:hover{color:var(--tx);border-color:var(--br2);}
.bell-btn.on{color:var(--gn);border-color:rgba(52,211,153,0.35);background:var(--gnb);}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--sf2);border:1px solid var(--br);border-radius:22px;padding:4px 14px 4px 5px;transition:.18s;}
.user-chip:hover{border-color:var(--br2);}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,var(--ac2),var(--acd));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 1px 0 rgba(255,255,255,0.2) inset;}
.uname{font-size:12.5px;font-weight:600;color:var(--tx2);}
.content{padding:24px;flex:1;max-width:1080px;width:100%;margin:0 auto;}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px;}
.stat{background:linear-gradient(165deg,var(--sf),#101218);border:1px solid var(--br);border-radius:16px;padding:16px 16px 15px;box-shadow:var(--shadow);transition:transform .25s var(--ease),border-color .25s var(--ease);position:relative;overflow:hidden;animation:fadeUp .5s var(--ease) both;}
.stat:hover{transform:translateY(-3px);border-color:var(--br2);}
.stat-top{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.stat-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--acl);color:var(--ac2);}
.stat-ic.gr{background:var(--gnb);color:var(--gn);}.stat-ic.rd{background:var(--rdb);color:var(--rd);}.stat-ic.or{background:var(--acl);color:var(--ac2);}
.stat-lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.7px;font-weight:600;}
.stat-n{font-size:30px;font-weight:780;letter-spacing:-1px;line-height:1;}
.stat-n.or{color:var(--ac2);}.stat-n.gr{color:var(--gn);}.stat-n.rd{color:var(--rd);}
.stat-t{font-size:11px;color:var(--tx3);margin-top:5px;}

/* ===== SECTIONS ===== */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.sec-t{font-size:15px;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;}

/* ===== PUB CARD ===== */
.pub-card{background:linear-gradient(180deg,var(--sf),#101218);border:1px solid var(--br);border-radius:18px;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);animation:fadeUp .5s var(--ease) both;}
.pub-card:hover{transform:translateY(-3px);border-color:var(--br2);box-shadow:var(--shadow-lg);}
.thumb{width:100%;height:340px;background:var(--sf2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);}
.pub-card:hover .thumb img{transform:scale(1.035);}
.thumb>i{font-size:50px;color:var(--tx3);}
.thumb:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,transparent 22%,transparent 60%,rgba(0,0,0,0.45) 100%);pointer-events:none;}
.ov-l{position:absolute;top:12px;left:12px;display:flex;gap:7px;z-index:2;}
.ov-r{position:absolute;top:12px;right:12px;z-index:2;}
.th-btn{background:rgba(8,10,15,0.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);border-radius:10px;width:36px;height:36px;cursor:pointer;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.18s var(--ease);}
.th-btn:hover{background:rgba(8,10,15,0.8);transform:scale(1.06);}
.pub-body{padding:14px 16px 4px;}
.pub-foot{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--br);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.ttag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;padding:5px 9px;border-radius:7px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:4px;}
.ttag.imagen{background:rgba(56,189,248,0.22);color:#bae6fd;border:1px solid rgba(56,189,248,0.3);}
.ttag.video{background:rgba(52,211,153,0.22);color:#bbf7d0;border:1px solid rgba(52,211,153,0.3);}
.pdate{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:5px;}
.cap-wr{position:relative;margin-bottom:6px;}
.cap-p{font-size:13.5px;color:var(--tx2);line-height:1.65;padding-right:38px;}
.cap-eb{position:absolute;top:-2px;right:0;background:var(--sf2);border:1px solid var(--br);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--tx3);font-size:13px;transition:.18s var(--ease);display:flex;align-items:center;justify-content:center;}
.cap-eb:hover{color:var(--ac2);border-color:var(--ac);background:var(--acl);}
.cap-ta{width:100%;background:var(--sf2);border:1px solid var(--ac);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--tx);line-height:1.6;resize:vertical;min-height:84px;margin-bottom:8px;font-family:inherit;box-shadow:0 0 0 3px var(--acl);}
.cap-ta:focus{outline:none;}
.cap-btns{display:flex;gap:8px;}
.cap-sv{font-size:12px;padding:7px 14px;background:var(--ac);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:.15s;}
.cap-sv:hover{background:var(--acd);}
.cap-cx{font-size:12px;padding:7px 14px;background:transparent;color:var(--tx3);border:1px solid var(--br);border-radius:8px;cursor:pointer;}
.plats{display:flex;gap:6px;flex-wrap:wrap;}
.ptag{font-size:10.5px;font-weight:500;color:var(--tx2);background:var(--sf2);border:1px solid var(--br);border-radius:7px;padding:3px 9px;display:flex;align-items:center;gap:4px;}
.pub-acts{display:flex;gap:8px;align-items:center;}
.foot-hint{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px;}
.spill{font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(8px);}
.spill:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
.spill.pending{background:rgba(123,92,240,0.22);color:#c9bcfb;border:1px solid rgba(123,92,240,0.3);}
.spill.approved{background:rgba(52,211,153,0.2);color:#bbf7d0;border:1px solid rgba(52,211,153,0.3);}
.spill.rejected{background:rgba(248,113,113,0.2);color:#fecaca;border:1px solid rgba(248,113,113,0.3);}
.spill.published{background:rgba(56,189,248,0.2);color:#bae6fd;border:1px solid rgba(56,189,248,0.3);}
.spill.error{background:rgba(248,113,113,0.28);color:#fca5a5;border:1px solid rgba(248,113,113,0.4);}
.spill.cancelled{background:rgba(92,99,133,0.25);color:var(--tx2);border:1px solid var(--br2);}

/* ===== BUTTONS ===== */
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--br);background:var(--sf2);cursor:pointer;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:all .18s var(--ease);}
.btn:hover{border-color:var(--br2);color:var(--tx);transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(0.98);}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn.approve{border-color:rgba(52,211,153,0.4);color:var(--gn);background:var(--gnb);}
.btn.approve:hover{background:rgba(52,211,153,0.18);}
.btn.reject{border-color:rgba(248,113,113,0.4);color:var(--rd);background:var(--rdb);}
.btn.reject:hover{background:rgba(248,113,113,0.18);}
.btn-p{padding:11px 18px;background:linear-gradient(150deg,var(--ac2),var(--acd));color:#fff;border:none;border-radius:11px;font-size:13.5px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s var(--ease);box-shadow:0 8px 22px -8px var(--ac-gl),0 1px 0 rgba(255,255,255,0.25) inset;}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px var(--ac-gl),0 1px 0 rgba(255,255,255,0.25) inset;}
.btn-p:active{transform:translateY(0) scale(0.99);}
.btn-p:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.ref-btn{font-size:12px;font-weight:600;color:var(--tx2);background:var(--sf2);border:1px solid var(--br);border-radius:10px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.18s var(--ease);}
.ref-btn:hover{color:var(--tx);border-color:var(--br2);}
.ref-btn:active i{animation:spin .5s var(--ease);}

/* ===== STATES / ALERTS ===== */
.empty{text-align:center;padding:56px 20px;color:var(--tx3);}
.empty-ic{width:64px;height:64px;border-radius:18px;background:var(--sf2);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;color:var(--tx3);}
.empty p{font-size:13.5px;}
.ld{text-align:center;padding:44px;color:var(--tx3);font-size:13px;}
.ld i{font-size:24px;display:block;margin-bottom:10px;animation:spin 1s linear infinite;}
.err-b,.ok-b,.info-b{border-radius:12px;padding:13px 15px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;animation:slideDown .35s var(--ease);}
.err-b{background:var(--rdb);border:1px solid rgba(248,113,113,0.3);color:#fca5a5;}
.ok-b{background:var(--gnb);border:1px solid rgba(52,211,153,0.3);color:#86efac;}
.info-b{background:var(--blb);border:1px solid rgba(56,189,248,0.3);color:#7dd3fc;}

/* ===== CARDS (config/cal) ===== */
.card{background:linear-gradient(180deg,var(--sf),#101218);border:1px solid var(--br);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-lbl{font-size:11px;font-weight:650;letter-spacing:0.8px;text-transform:uppercase;color:var(--tx3);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.days-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px;}
.day-b{padding:11px 2px;border:1px solid var(--br);border-radius:10px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:600;background:var(--sf2);color:var(--tx2);transition:.18s var(--ease);}
.day-b:hover{border-color:var(--br2);color:var(--tx);}
.day-b.sel{background:linear-gradient(150deg,var(--ac2),var(--acd));color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px var(--ac-gl);}
.frow{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.flbl{font-size:12.5px;font-weight:500;color:var(--tx2);min-width:72px;}
.fsel{padding:10px 12px;border:1px solid var(--br);border-radius:10px;background:var(--sf2);font-size:13px;color:var(--tx);font-family:inherit;flex:1;transition:.15s;}
.fsel:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acl);}
.srow{display:flex;align-items:flex-start;justify-content:space-between;padding:14px;background:var(--sf2);border:1px solid var(--br);border-radius:12px;margin-bottom:9px;gap:12px;transition:.18s var(--ease);}
.srow:hover{border-color:var(--br2);}
.sm{font-size:13.5px;font-weight:600;display:flex;align-items:center;}
.sd{font-size:11.5px;color:var(--tx3);margin-top:3px;}
.ic-btn{background:transparent;border:1px solid var(--br);border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--tx3);font-size:14px;flex-shrink:0;transition:.18s var(--ease);display:flex;align-items:center;justify-content:center;}
.ic-btn:hover{color:var(--rd);border-color:rgba(248,113,113,0.4);background:var(--rdb);}
.h-item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--br);transition:.15s;}
.h-item:hover{background:rgba(255,255,255,0.015);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--gn);display:inline-block;margin-right:8px;box-shadow:0 0 0 0 rgba(52,211,153,0.6);animation:pulse 2s infinite;}

/* ===== LOGIN ===== */
.login-w{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
.login-glow{position:absolute;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(123,92,240,0.22),transparent 62%);top:-220px;filter:blur(20px);animation:floaty 9s ease-in-out infinite;}
.login-glow.b{background:radial-gradient(circle,rgba(56,189,248,0.12),transparent 62%);bottom:-260px;top:auto;right:-160px;animation-delay:-4s;}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent 75%);}
.login-c{position:relative;z-index:2;background:linear-gradient(180deg,rgba(26,29,38,0.9),rgba(16,18,24,0.92));backdrop-filter:blur(20px);border:1px solid var(--br2);border-radius:22px;padding:38px 32px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);animation:fadeUp .6s var(--ease) both;}
.l-brand{display:flex;align-items:center;gap:13px;margin-bottom:8px;}
.l-ico{width:48px;height:48px;background:linear-gradient(150deg,var(--ac2),var(--acd));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;box-shadow:0 10px 26px -8px var(--ac-gl),0 1px 0 rgba(255,255,255,0.3) inset;}
.l-title{font-size:26px;font-weight:780;letter-spacing:-0.8px;}
.l-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ac2);background:var(--acl);border:1px solid rgba(123,92,240,0.25);border-radius:20px;padding:3px 10px;margin-top:3px;}
.l-sub{font-size:13.5px;color:var(--tx3);margin:18px 0 26px;line-height:1.55;}
.fg{margin-bottom:16px;}
.fl{font-size:12px;font-weight:600;margin-bottom:7px;display:block;color:var(--tx2);}
.fi{width:100%;padding:13px 15px;border:1px solid var(--br);border-radius:11px;background:var(--sf2);font-size:14px;color:var(--tx);font-family:inherit;transition:.18s var(--ease);}
.fi::placeholder{color:var(--tx3);}
.fi:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acl);}
